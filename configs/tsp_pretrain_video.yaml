# Configuration for Video Temporal Snippet Pretraining (TSP)
modality: video
backbone: "google/vivit-b-16x2-kinetics400"
hidden_dim: 768
snippet_duration: 2.0
frames_per_snippet: 32
crop_size: 224
target_fps: 25

# Training Hyperparameters
batch_size: 16
lr: 1.0e-4
weight_decay: 1.0e-4
max_epochs: 20
patience: 3
iou_threshold: 0.5 # 50% overlap rule for foreground labeling

checkpoint_dir: "backbones/checkpoints/tsp_video"
save_path: "backbones/vivit_tsp.pt"
